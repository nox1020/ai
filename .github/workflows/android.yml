name: Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  LLAMA_CPP_TAG: v0.8.0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Install NDK 29 + CMake 3.31.6
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
          echo "ANDROID_NDK_ROOT_29=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"
      - name: Vulkan + SPIR-V headers (for the GPU backend)
        if: ${{ !contains(github.event.head_commit.message, '[no-vulkan]') }}
        run: |
          P=$RUNNER_TEMP/vk
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers $RUNNER_TEMP/vh
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers $RUNNER_TEMP/sh
          cmake -S $RUNNER_TEMP/vh -B $RUNNER_TEMP/vh/b -DCMAKE_INSTALL_PREFIX=$P >/dev/null && cmake --install $RUNNER_TEMP/vh/b >/dev/null
          cmake -S $RUNNER_TEMP/sh -B $RUNNER_TEMP/sh/b -DCMAKE_INSTALL_PREFIX=$P -DSPIRV_HEADERS_ENABLE_TESTS=OFF >/dev/null && cmake --install $RUNNER_TEMP/sh/b >/dev/null
          ls $P/include/vulkan/vulkan.hpp $P/share/cmake/SPIRV-Headers
          echo "OGBA_VULKAN_PREFIX=$P" >> "$GITHUB_ENV"
      - name: Fetch llama.cpp
        run: git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp
      - name: Restore release keystore
        env: { KS: "${{ secrets.OGBA_KEYSTORE_B64 }}" }
        run: |
          test -n "$KS" || { echo "missing OGBA_KEYSTORE_B64 secret"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ogba-release.jks"
          echo "OGBA_KEYSTORE_FILE=$RUNNER_TEMP/ogba-release.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          OGBA_KEYSTORE_PASSWORD: ${{ secrets.OGBA_KEYSTORE_PASSWORD }}
          OGBA_KEY_ALIAS: ${{ secrets.OGBA_KEY_ALIAS }}
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Verify signature
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $AS verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -q "SHA-256 digest: efa45dc7f95c21a4c101240c0b1d9c706fb8eedd856708" certs.txt
      - name: List native libs
        run: unzip -l app/build/outputs/apk/release/app-release.apk | grep "lib/arm64" || true
      - name: Collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ogba.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/ogba-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: ogba-apk, path: out/*.apk }
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: ogba v0.1.${{ github.run_number }}
          make_latest: true
          body: "OGBA – offline on-device AI assistant for Android (llama.cpp ${{ env.LLAMA_CPP_TAG }}). Download **ogba.apk** and install. / دستیار هوش مصنوعی کاملاً آفلاین برای اندروید. فایل ogba.apk را دانلود و نصب کنید."
          files: out/*.apk
